<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css" />
  <meta charset="UTF-8" />
  <title>Panel Strip Prototype – Static Under Panels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <div class="panel-strip" id="panelStrip"></div>

  <script>
    // --- Pantone-like dictionary (placeholder sample data for now) ---
    const pantonePalette = [
      {
        hex: "#1A1A1A",
        name: "Neutral Black",
        textColor: "#F5F5F5",
        role: "background",
      },
      {
        hex: "#F5F5F5",
        name: "Soft White",
        textColor: "#111111",
        role: "background",
      },
      {
        hex: "#003366",
        name: "Deep Blue",
        textColor: "#F5F5F5",
        role: "accent",
      },
      {
        hex: "#005F73",
        name: "Teal",
        textColor: "#F5F5F5",
        role: "accent",
      },
      {
        hex: "#EE9B00",
        name: "Warm Amber",
        textColor: "#111111",
        role: "accent",
      },
      {
        hex: "#0A9396",
        name: "Sea Green",
        textColor: "#F5F5F5",
        role: "background",
      },
      {
        hex: "#E0E0E0",
        name: "Cool Grey",
        textColor: "#111111",
        role: "background",
      },
    ];

    // Utility: pick a random panel from the palette, excluding a hex if provided
    function getRandomPantone(excludeHex = null) {
      let filtered = pantonePalette;
      if (excludeHex) {
        filtered = pantonePalette.filter(p => p.hex !== excludeHex);
      }
      const idx = Math.floor(Math.random() * filtered.length);
      return { ...filtered[idx] };
    }

    // --- State ---
    const NUM_PANELS = 8;
    const neutralBlack = { ...pantonePalette[0] }; // Neutral Black
    const softWhite = { ...pantonePalette[1] }; // Soft White
    const middleIndex = Math.floor(NUM_PANELS / 2);
    let panels = Array.from({ length: NUM_PANELS }, (_, i) => {
      const basePanel = i === middleIndex ? { ...softWhite } : { ...neutralBlack };
      return { ...basePanel, originalIndex: i };
    });
    let panelsHistory = Array.from({ length: NUM_PANELS }, () => []);
    let direction = 1; // 1 = right, -1 = left

    const stripEl = document.getElementById("panelStrip");

    function renderPanels() {
      for (let i = 0; i < panels.length; i++) {
        renderPanelAtIndex(i, panels[i]);
      }
    }

    // --- Initialize a panel element with data ---
    function initializePanelElement(panelEl, index, panelData, options = {}) {
      panelEl.className = options.className || "panel";
      panelEl.dataset.index = index.toString();

      // Create or get content element
      let content = panelEl.querySelector(".panel-content");
      if (!content) {
        content = document.createElement("div");
        content.className = "panel-content";
        panelEl.appendChild(content);
      }

      // Apply panel data
      if (panelData) {
        panelEl.style.backgroundColor = panelData.hex;
        panelEl.style.color = panelData.textColor;
        const originalIndex = panelData.originalIndex !== undefined ? panelData.originalIndex : index;
        content.innerText = `${originalIndex}: ${panelData.name}`;
      }

      // Add click listener if specified
      if (options.addClickListener) {
        panelEl.addEventListener("click", handlePanelClick);
      }

      return panelEl;
    }

    // --- Create a new panel element ---
    function createPanelElement(index, panelData, options = {}) {
      const panelEl = document.createElement("div");
      return initializePanelElement(panelEl, index, panelData, options);
    }

    function renderPanelAtIndex(index, panelData) {
      const wrapper = stripEl.querySelector(`.panel-wrapper[data-index="${index}"]`);
      if (!wrapper || !panelData) return;

      const topEl = wrapper.querySelector(".panel");
      const underEl = wrapper.querySelector(".under-panel");

      if (topEl) {
        topEl.style.backgroundColor = panelData.hex;
        topEl.style.color = panelData.textColor;
        const c = topEl.querySelector(".panel-content");
        if (c) {
          const originalIndex = panelData.originalIndex !== undefined ? panelData.originalIndex : index;
          c.innerText = `${originalIndex}: ${panelData.name}`;
        }
      }

      if (underEl) {
        underEl.style.backgroundColor = panelData.hex;
        underEl.style.color = panelData.textColor;
        const sc = underEl.querySelector(".static-content");
        if (sc) {
          const originalIndex = panelData.originalIndex !== undefined ? panelData.originalIndex : index;
          sc.innerText = `${originalIndex}: ${panelData.name}`;
        }
      }
    }

    // --- DOM creation ---
    function createPanelElements() {
      stripEl.innerHTML = "";
      panels.forEach((panel, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "panel-wrapper";
        wrapper.dataset.index = index.toString();

        const under = document.createElement("div");
        under.className = "under-panel";

        const underText = document.createElement("div");
        underText.className = "panel-content static-content";
        under.appendChild(underText);

        const panelEl = createPanelElement(index, panel, { addClickListener: true });

        wrapper.appendChild(under);
        wrapper.appendChild(panelEl);
        stripEl.appendChild(wrapper);
      });
    }

function handlePanelClick(event) {
  const panelEl = event.currentTarget;
  const fromIndex = Number(panelEl.dataset.index);
  const toIndex = fromIndex + direction;

  if (toIndex < 0 || toIndex >= NUM_PANELS) {

    // If there is history, restore the previous color
    if (panelsHistory[fromIndex].length > 0) {
      panels[fromIndex] = panelsHistory[fromIndex].pop();
      renderPanelAtIndex(fromIndex, panels[fromIndex]);
      direction *= -1;
      console.log('History response');
      console.log(panels);
      return;
    }

    // Otherwise behave normally
    const newRandomPanel = { ...getRandomPantone(panels[fromIndex].hex), originalIndex: fromIndex };
    panelsHistory[fromIndex].push(panels[fromIndex]); // save previous color
    panels[fromIndex] = newRandomPanel;

    renderPanelAtIndex(fromIndex, panels[fromIndex]);
    direction *= -1;
    console.log('Standard response');
    console.log(panels);
    return;
  }

  const clickedPanelData = panels[fromIndex];
  const newRandomPanel = { ...getRandomPantone(clickedPanelData.hex), originalIndex: fromIndex };

  // Save previous colors before overwriting
  panelsHistory[fromIndex].push(clickedPanelData);
  panelsHistory[toIndex].push(panels[toIndex]);

  // Update state
  panels[toIndex] = { ...clickedPanelData };
  panels[fromIndex] = newRandomPanel;

  // Re-render both positions
  renderPanelAtIndex(toIndex, panels[toIndex]);
  renderPanelAtIndex(fromIndex, panels[fromIndex]);

  direction *= -1;
  console.log('Click response');
  console.log(panels);
}

  // --- Initial bootstrapping ---
  createPanelElements();
  renderPanels();
</script>
</body>
</html>
